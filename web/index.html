<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleeper Power Rankings</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Sleeper Power Rankings</h1>
  <form id="form">
    <label>Sleeper username or league ID
      <input id="q" required placeholder="username, or a numeric league ID" autocomplete="off">
    </label>
    <button>Load</button>
  </form>
  <div id="leagues" hidden></div>
  <p id="status" role="status"></p>
  <section id="result" hidden>
    <h2 id="title"></h2>
    <div class="actions">
      <label>Through week <select id="through"></select></label>
      <span><button id="share" type="button">Copy link</button> <button id="png" type="button">Download PNG</button></span>
    </div>
    <div class="scroll"><table id="table"></table></div>
    <details>
      <summary>Roster ranks</summary>
      <p class="hint" id="rankHint"></p>
      <ol id="rankList"></ol>
      <p class="hint"><button id="rankReset" type="button">Reset to FantasyCalc</button></p>
    </details>
    <details>
      <summary>Weights</summary>
      <p class="hint">A rank in each category is multiplied by its weight (lower total is better). Gray values are automatic, as in the original spreadsheet, and change with the week; type to override.</p>
      <div id="weights" class="grid"></div>
      <p class="hint"><button id="weightReset" type="button">Reset to automatic</button></p>
    </details>
    <p class="hint" id="notes"></p>
  </section>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
